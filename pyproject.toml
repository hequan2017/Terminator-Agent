[project]
name = "terminator-agent"
version = "0.1.0"
description = "网页版 Linux 运维 AI 助手：SSH 密钥登录、对话排障、应用发版"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncssh>=2.18",
    "httpx>=0.27",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:unraisableexception"

[tool.uv]
package = false
